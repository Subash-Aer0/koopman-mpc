# Vehicle of quadrotor.toml plus a motor model: rotor speeds have their own
# dynamics and slow under aerodynamic torque (dynamics/motor.py), so the measured
# rotor speeds Ω_R differ from the command and the CCTA paper's residual thrust
# f_res = f_c − Σ k_T Ω_R² is non-zero. Opt-in: quadrotor.toml (ideal motor) stays
# the default, so earlier runs remain reproducible. Everything above [motor] must
# equal quadrotor.toml (tests/test_actuator.py checks this).
#
# Rigid-body and drag parameters for the quadrotor model (src/dynamics).
#
# PLACEHOLDER VALUES: the paper does not report vehicle parameters. These are
# generic F450-class numbers chosen only to give a plausible ~1 kg vehicle.
# Replace them with identified values before drawing quantitative conclusions.
#
# Frames: body is FRD (x forward, y right, z down), world is NED.

[vehicle]
mass = 1.0  # kg
# Moment of inertia about the centre of mass, body FRD frame, kg·m².
inertia = [
    [0.0082, 0.0, 0.0],
    [0.0, 0.0082, 0.0],
    [0.0, 0.0, 0.0149],
]

[drag]
# Diagonal of D in f_D = R D v_rb ||v_rb|| (Sec. II-A), body FRD axes, N·s²/m².
# At 5 m/s air-relative speed along x this gives 1.25 N, about 0.13 g.
coefficients = [0.05, 0.05, 0.10]

[environment]
gravity = 9.81  # m/s², acts along +z in NED

[rotor]
# How the commanded thrust and torque become the applied ones (dynamics/actuator.py).
# "ideal": exactly as commanded (no rotor model). "bemt": mixer -> rotor speeds ->
# blade element momentum theory in each rotor's airflow (dynamics/rotor.py), so
# thrust changes with wind and climb rate; the controllers do not know this.
model = "bemt"
rotor_config = "rotor.toml"      # relative to this file; used when model = "bemt"

[motor]
# Open-loop (voltage-driven) brushless motor, J_r Ω̇ = k_m (Ω_cmd − Ω) + k_Q Ω_cmd² − Q_aero.
# PLACEHOLDER VALUES for a ~920 KV motor with a 10x4.5 propeller:
#   K_t = K_e = 60 / (2π · 920) ≈ 0.0104 N·m/A, winding resistance R ≈ 0.1 Ω
#   -> k_m = K_t K_e / R ≈ 1.1e-3 N·m·s/rad; J_r (propeller + bell) ≈ 3e-5 kg·m²
#   -> τ_m = J_r / k_m ≈ 0.03 s.
# A +4 % aerodynamic torque at hover (0.039 N·m) then slows the rotor by ≈ 1.6 rad/s (0.3 %).
model = "first_order"            # "ideal": Ω = Ω_cmd
time_constant = 0.03             # τ_m, s
rotor_inertia = 3.0e-5           # J_r, kg·m²
