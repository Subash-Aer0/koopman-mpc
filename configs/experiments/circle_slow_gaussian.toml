# Slow level circle (peak tilt ≈ 0.08 rad, inside the hover model's validity)
# in the Gaussian wind of the CCTA paper. Two laps.
# Paths are relative to this file. Frames: world NED (z down), body FRD.

[experiment]
name = "circle_slow_gaussian"
seed = 0
duration = 20.0                          # s
vehicle_config = "../quadrotor.toml"
controller_config = "../baseline.toml"

[initial_state]
start_on_reference = true

[reference]
type = "circle"
center = [0.0, 0.0, -2.0]                # m, NED
radius = 2.0                             # m
vertical_amplitude = 0.0                 # m, level circle
period = 10.0                            # s per lap; speed ≈ 1.26 m/s
yaw_deg = 0.0

[wind]
type = "gaussian"
mean = [2.7032, 1.7566, 0.0124]          # m/s, Sec. IV-A
cov = [                                  # (m/s)²
    [0.5434, 0.0, 0.0],
    [0.0, 0.4197, 0.0],
    [0.0, 0.0, 0.0064],
]
hold_period = 0.1                        # s
