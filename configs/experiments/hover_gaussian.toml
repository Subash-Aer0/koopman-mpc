# 1 m climb to a hover setpoint in the Gaussian wind of the CCTA paper.
# Paths are relative to this file. Frames: world NED (z down), body FRD.

[experiment]
name = "hover_gaussian"
seed = 0
duration = 15.0                          # s, integer multiple of timing.dt_sim
vehicle_config = "../quadrotor.toml"
controller_config = "../baseline.toml"

[initial_state]
position = [0.0, 0.0, 0.0]               # m, NED
euler_deg = [0.0, 0.0, 0.0]              # [roll, pitch, yaw], deg, ZYX
velocity = [0.0, 0.0, 0.0]               # m/s, NED
body_rate = [0.0, 0.0, 0.0]              # rad/s, FRD

[reference]
type = "setpoint"
position = [0.0, 0.0, -1.0]              # m, NED; 1 m above the start
yaw_deg = 0.0

[wind]
type = "gaussian"
mean = [2.7032, 1.7566, 0.0124]          # m/s, Sec. IV-A
cov = [                                  # (m/s)²
    [0.5434, 0.0, 0.0],
    [0.0, 0.4197, 0.0],
    [0.0, 0.0, 0.0064],
]
hold_period = 0.1                        # s
